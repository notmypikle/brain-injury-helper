name: Android build

# Builds the app in the cloud and produces an installable APK, so no
# computer/Android Studio is needed. Also catches build errors on every
# change (risk I6). Download the APK: Actions tab → latest run →
# "bih-debug-apk" under Artifacts.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: apps/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bih-debug-apk
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
